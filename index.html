<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大老二網絡版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- 連接狀態指示器 -->
    <div id="connectionStatus" class="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">正在連接...</span>
    </div>

    <div id="lobbyPanel" class="panel active">
        <div class="panel-content">
            <div class="lobby-simple">
                <h1 style="text-align:center; margin: 18px 0 10px;">大老二 網絡桌</h1>
                <div class="section entry-section" style="max-width:560px; margin: 0 auto;">
                    <div class="input-group" style="justify-content:center; gap:12px;">
                        <input type="text" id="playerNameInput" placeholder="輸入你的暱稱" maxlength="20" style="max-width:320px;" />
                        <button id="confirmCreateRoomBtn" class="btn btn-primary">開始</button>
                    </div>
                    <div class="button-group" style="justify-content:center; margin-top:12px;">
                        <button id="refreshRoomsBtn" class="btn btn-secondary">查看房間</button>
                    </div>
                    <div id="roomsList" class="rooms-container" style="margin-top:14px;"><p class="empty">暫無房間</p></div>
                    <div id="lobbyError" class="error-message" style="margin-top:12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="waitingPanel" class="panel">
        <div class="panel-content">
            <header class="room-banner">
                <div>
                    <p class="eyebrow">等待區</p>
                    <h1 id="roomNameDisplay">牌桌準備中</h1>
                </div>
                <p class="subtitle">等待其他玩家加入</p>
            </header>

            <div class="seats-container">
                <div id="seat0" class="seat"><div class="seat-player">--</div></div>
                <div id="seat1" class="seat"><div class="seat-player">--</div></div>
                <div id="seat2" class="seat"><div class="seat-player">--</div></div>
                <div id="seat3" class="seat"><div class="seat-player">--</div></div>
            </div>

            <div class="button-group">
                <button id="readyBtn" class="btn btn-primary">準備</button>
                <button id="leaveWaitingBtn" class="btn btn-secondary">離開房間</button>
            </div>

            <div id="waitingError" class="error-message"></div>
        </div>
    </div>

    <div id="gamePanel" class="panel">
        <div class="panel-content game-layout">
            <header class="game-banner">
                <div>
                    <p class="eyebrow">對局中</p>
                    <h1 id="gameTitle">牌桌已展開</h1>
                    <p class="subtitle">保持節奏，依局勢出牌。</p>
                </div>
                <div class="game-banner-meta">
                    <div class="meta-pill" id="playerCountPill">席位 0 / 4</div>
                </div>
            </header>

            <div class="game-top">
                <div id="opponent0" class="opponent-seat">
                    <div class="opponent-name">--</div>
                    <div class="opponent-cards"></div>
                    <div class="opponent-hand-size">0</div>
                </div>
                <div id="opponent1" class="opponent-seat">
                    <div class="opponent-name">--</div>
                    <div class="opponent-cards"></div>
                    <div class="opponent-hand-size">0</div>
                </div>
                <div id="opponent2" class="opponent-seat">
                    <div class="opponent-name">--</div>
                    <div class="opponent-cards"></div>
                    <div class="opponent-hand-size">0</div>
                </div>
            </div>

            <div class="game-middle">
                <div class="table-area">
                    <div class="current-turn-indicator" id="turnIndicator">等待...</div>
                    <div class="table-cards" id="tableCards">
                        <span class="placeholder">等待出牌...</span>
                    </div>
                </div>
            </div>

            <div class="game-bottom">
                <div class="hand-info"><span class="hand-label">手牌</span><span id="handCount">0</span></div>
                <div class="hand-cards" id="handCards">
                    <span class="placeholder">載入中...</span>
                </div>
            </div>

            <div class="action-buttons">
                <button id="suggestBtn" class="btn btn-secondary">提示</button>
                <button id="playBtn" class="btn btn-primary" disabled>出牌</button>
                <button id="passBtn" class="btn btn-secondary" disabled>不出</button>
                <button id="leaveGameBtn" class="btn btn-danger">離開</button>
            </div>

            <div id="suggestionOptions" class="suggestion-options"></div>
            <div id="lastAction" class="last-action">最近：暫無</div>

            <div id="gameError" class="error-message"></div>
        </div>

        <div id="settlementOverlay" class="settlement-overlay">
            <div class="settlement-card">
                <h2 id="settlementTitle">本局結算</h2>
                <p id="settlementWinner" class="settlement-winner">贏家: -</p>
                <div id="settlementRows" class="settlement-rows"></div>
                <div class="settlement-actions">
                    <button id="settlementCloseBtn" class="btn btn-secondary">返回準備區</button>
                    <button id="settlementReadyBtn" class="btn btn-primary">我已準備下一局</button>
                </div>
            </div>
        </div>
    </div>

    <script src="ws.js?v=20260504-2"></script>
    <script src="ui.js?v=20260504-2"></script>
</body>
</html>
